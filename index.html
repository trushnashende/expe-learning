<html>
<head>
    <title>ABC Flashcards</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<center>

<h1 class="title">ABC FLASHCARDS</h1>
<p class="subtitle">A to Z Alphabets</p>

<!-- SEARCH + RANDOM -->
<input type="text" id="searchBox" placeholder="Enter Alphabet (A-Z)">
<button onclick="searchAlphabet()">Search</button>
<button onclick="randomCard()">Random</button>

<h2 id="result"></h2>

<div class="flashcard-container">

<table>

<tr>
<td class="flashcard"><div class="front">A</div><div class="back">Apple</div></td>
<td class="flashcard"><div class="front">B</div><div class="back">Ball</div></td>
<td class="flashcard"><div class="front">C</div><div class="back">Cat</div></td>
<td class="flashcard"><div class="front">D</div><div class="back">Dog</div></td>
<td class="flashcard"><div class="front">E</div><div class="back">Elephant</div></td>
<td class="flashcard"><div class="front">F</div><div class="back">Frog</div></td>
<td class="flashcard"><div class="front">G</div><div class="back">Grapes</div></td>
<td class="flashcard"><div class="front">H</div><div class="back">Hat</div></td>
</tr>

<tr>
<td class="flashcard"><div class="front">I</div><div class="back">Ice Cream</div></td>
<td class="flashcard"><div class="front">J</div><div class="back">Juice</div></td>
<td class="flashcard"><div class="front">K</div><div class="back">Kite</div></td>
<td class="flashcard"><div class="front">L</div><div class="back">Lion</div></td>
<td class="flashcard"><div class="front">M</div><div class="back">Monkey</div></td>
<td class="flashcard"><div class="front">N</div><div class="back">Nest</div></td>
<td class="flashcard"><div class="front">O</div><div class="back">Octopus</div></td>
<td class="flashcard"><div class="front">P</div><div class="back">Penguin</div></td>
</tr>

<tr>
<td class="flashcard"><div class="front">Q</div><div class="back">Queen</div></td>
<td class="flashcard"><div class="front">R</div><div class="back">Rainbow</div></td>
<td class="flashcard"><div class="front">S</div><div class="back">Sun</div></td>
<td class="flashcard"><div class="front">T</div><div class="back">Turtle</div></td>
<td class="flashcard"><div class="front">U</div><div class="back">Umbrella</div></td>
<td class="flashcard"><div class="front">V</div><div class="back">Violin</div></td>
<td class="flashcard"><div class="front">W</div><div class="back">Whale</div></td>
<td class="flashcard"><div class="front">X</div><div class="back">Xylophone</div></td>
</tr>

<tr>
<td class="flashcard"><div class="front">Y</div><div class="back">Yak</div></td>
<td class="flashcard"><div class="front">Z</div><div class="back">Zebra</div></td>
</tr>

</table>

</div>

<hr>

<p class="footer">A to Z Alphabets</p>

</center>

<script>
// DATA (acts like API)
const flashcards = [
  {letter: "A", word: "Apple"},
  {letter: "B", word: "Ball"},
  {letter: "C", word: "Cat"},
  {letter: "D", word: "Dog"},
  {letter: "E", word: "Elephant"},
  {letter: "F", word: "Frog"},
  {letter: "G", word: "Grapes"},
  {letter: "H", word: "Hat"},
  {letter: "I", word: "Ice Cream"},
  {letter: "J", word: "Juice"},
  {letter: "K", word: "Kite"},
  {letter: "L", word: "Lion"},
  {letter: "M", word: "Monkey"},
  {letter: "N", word: "Nest"},
  {letter: "O", word: "Octopus"},
  {letter: "P", word: "Penguin"},
  {letter: "Q", word: "Queen"},
  {letter: "R", word: "Rainbow"},
  {letter: "S", word: "Sun"},
  {letter: "T", word: "Turtle"},
  {letter: "U", word: "Umbrella"},
  {letter: "V", word: "Violin"},
  {letter: "W", word: "Whale"},
  {letter: "X", word: "Xylophone"},
  {letter: "Y", word: "Yak"},
  {letter: "Z", word: "Zebra"}
];

// SEARCH
function searchAlphabet() {
  let input = document.getElementById("searchBox").value.toUpperCase();

  let result = flashcards.find(f => f.letter === input);

  if (result) {
    document.getElementById("result").innerHTML =
      result.letter + " - " + result.word;
  } else {
    document.getElementById("result").innerHTML = "Not Found!";
  }
}

// RANDOM
function randomCard() {
  let random = flashcards[Math.floor(Math.random() * flashcards.length)];

  document.getElementById("result").innerHTML =
    random.letter + " - " + random.word;
}
</script>

</body>
</html>
